name: AH prices (hourly)

# Pulls the hourly WoW Forever price snapshot from auctionhouse.fyi (public, no key).
on:
  schedule:
    - cron: '7 * * * *'    # every hour at :07 (their snapshot is written at :01)
  workflow_dispatch:        # "Run workflow" button for a manual update
    inputs:
      probe:
        description: 'Only check price sources (debug)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ah-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch auction house prices
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then python scripts/probe_sources.py; exit 0; fi
          python scripts/fetch_prices.py
      - name: Save new prices
        run: |
          git config user.name "ah-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "AH prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push
