name: AH prices (hourly)

# Pulls WoW Forever AH prices from AHledger every hour (needs the AHLEDGER_KEY secret).
on:
  schedule:
    - cron: '7 * * * *'    # every hour at :07
  workflow_dispatch:        # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: ah-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch auction house prices
        env:
          AHLEDGER_KEY: ${{ secrets.AHLEDGER_KEY }}
        run: python scripts/fetch_prices.py
      - name: Save new prices
        run: |
          git config user.name "ah-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "AH prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push
